<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random</title>
    <style>
        #danceFloor{
         background: red; 
         width: 500px; 
         height: 500px; 
        }
        #panelOne{
         background: orange; 
         width: 200px; 
         height: 200px; 
        }
        #panelTwo{
         background: yellow; 
         width: 200px; 
         height: 200px; 
        }
        #danceEmoji{
         background: green;
         width: fit-content;
         height: fit-content;
        }
    </style>
</head>
<body>
    
    <div id="danceFloor">
        <div id="panelOne"></div>
        <div id="panelTwo"></div>
        <div id="danceEmoji">💃</div>

    </div>

    <script>
        function changePanelColors() {
            const panel1 = document.getElementById('panelOne');
            const panel2 = document.getElementById('panelTwo');
            const panels = [panel1, panel2];


            panels.forEach(panels => {
                let x = Math.floor(Math.random() * 255);
                let y = Math.floor(Math.random() * 255);
                let z = Math.floor(Math.random() * 255);

                panels.style.backgroundColor = `rgb(${x}, ${y}, ${z}`;
            });
        }

        setInterval(changePanelColors, 1500);


        function changeDanceFloorColors(){
    
                let x = Math.floor(Math.random() * 255);
                let y = Math.floor(Math.random() * 255);
                let z = Math.floor(Math.random() * 255);

                danceFloor.style.backgroundColor = `rgb(${x}, ${y}, ${z}`;

        }
        const danceFloor = document.getElementById('danceFloor');
        danceFloor.addEventListener("click", changeDanceFloorColors);

        
        

        function changeEmoji(event){
            const emojis = ['💃', '🕺', '🪩', '🎵', '✨', '🕺🏽'];
            
            let randomEmoji= Math.floor(Math.random() * emojis.length);

            danceEmoji.textContent = emojis[randomEmoji];
            event.stopPropagation();

        }
        const danceEmoji = document.getElementById('danceEmoji');
        danceEmoji.addEventListener("click", changeEmoji);

        





    </script>

</body>
</html>
